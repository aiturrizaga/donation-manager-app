<p-toast />
<p-confirm-dialog />

@if (navLoading.navigating()) {
  <div class="fixed top-0 left-0 right-0 z-50 h-0.5 overflow-hidden bg-transparent">
    <div class="h-full w-1/3 animate-pulse bg-primary"></div>
  </div>
}

@if (globalLoading.isBlocking()) {
  <div
    class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-3 bg-gray-900/40 backdrop-blur-sm"
    role="alert"
    aria-live="assertive"
  >
    <i class="ti ti-loader-2 animate-spin text-3xl text-white" aria-hidden="true"></i>
    <p class="text-sm font-medium text-white">{{ globalLoading.activeLabel() }}</p>
  </div>
}

<div class="shell">

  <app-sidebar
    [navItems]="sidebarNavigationItems()"
    [collapsed]="sidebarCollapsed()"
    (collapseToggled)="onSidebarCollapseToggled($event)"
  />

  <div class="shell__body">
    <app-navbar />

    <main class="shell__main">
      <router-outlet />
    </main>
  </div>

</div>
