<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-5">

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1">
      <label class="font-medium">Nombre</label>
      <input
        pInputText
        formControlName="name"
        placeholder="Ej. Página principal"
        maxlength="150"
        [invalid]="formValidator.hasError('name')"
      />
      @if (formValidator.hasError('name')) {
        <p-message severity="error" size="small" variant="simple">
          {{ formValidator.getErrorMessage('name') }}
        </p-message>
      }
    </div>

    <div class="flex flex-col gap-1">
      <label class="font-medium">Slug</label>
      <input
        pInputText
        formControlName="slug"
        placeholder="Ej. donaciones"
        maxlength="100"
        [invalid]="formValidator.hasError('slug')"
      />
      @if (formValidator.hasError('slug')) {
        <p-message severity="error" size="small" variant="simple">
          {{ formValidator.getErrorMessage('slug') }}
        </p-message>
      }
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label class="font-medium">
      Dominio personalizado
      <span class="text-gray-400 font-normal text-xs ml-1">(opcional)</span>
    </label>
    <div class="flex items-center gap-2">
      <input
        pInputText
        formControlName="domain"
        placeholder="donaciones.com"
        maxlength="255"
        class="flex-1"
      />
      @if (page().domain) {
        <p-tag
          [value]="getDomainStatusLabel()"
          [severity]="getDomainStatusSeverity()"
        />
      }
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label class="font-medium">
      Descripción
      <span class="text-gray-400 font-normal text-xs ml-1">(opcional)</span>
    </label>
    <textarea
      pTextarea
      formControlName="description"
      placeholder="Nota interna"
      rows="3"
      class="w-full"
    ></textarea>
  </div>

  @if (saveOp.error(); as err) {
    <p-message severity="error" size="small">
      {{ err.message }}
    </p-message>
  }

  <div class="flex justify-end">
    <p-button
      type="submit"
      label="Guardar cambios"
      [loading]="saveOp.isPending()"
    />
  </div>

</form>
