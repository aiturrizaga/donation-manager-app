<div class="card">

  <!-- Toolbar -->
  <div class="toolbar">
    <p class="text-sm text-gray-500 flex-1">
      Crea roles y define qué pueden ver/hacer, y a qué organizaciones tienen acceso.
    </p>
    <div class="toolbar__actions">
      <button pButton (click)="openCreateDialog()">
        <i class="ti ti-plus" pButtonIcon></i>
        <span pButtonLabel class="hidden sm:inline">Nuevo rol</span>
        <span pButtonLabel class="inline sm:hidden">Nuevo</span>
      </button>
    </div>
  </div>

  <!-- Data view -->
  @if (error()) {
    <app-inline-error
      message="No se pudo cargar la lista de roles."
      (retry)="reload()"
    />
  } @else {
    <app-role-data-view
      [items]="roles()"
      [isLoading]="loading()"
      emptyIcon="ti-shield-off"
      emptyTitle="Aún no hay roles"
      emptyDescription="Crea el primer rol personalizado para asignar permisos y organizaciones."
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    />
  }

</div>
