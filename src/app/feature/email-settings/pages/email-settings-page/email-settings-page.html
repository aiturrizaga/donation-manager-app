<div class="card">

  <!-- Toolbar -->
  <div class="toolbar">
    <app-organization-selector />
  </div>

  <!-- Empty state sin org seleccionada -->
  @if (!orgContext.selectedId()) {
    <div class="py-12 text-center">
      <i class="ti ti-mail text-5xl text-gray-300"></i>
      <p class="text-sm text-gray-400 mt-3">
        Selecciona una organización para configurar su servidor SMTP
      </p>
    </div>
  } @else if (facade.error(); as err) {
    <app-inline-error
      message="No se pudo cargar la configuración SMTP."
      (retry)="facade.reload()"
    />
  } @else if (facade.loading()) {
    <div class="py-12 text-center">
      <i class="ti ti-loader-2 animate-spin text-3xl text-gray-300"></i>
    </div>
  } @else {
    <app-email-settings-form
      [organizationId]="orgContext.selectedId()!"
      [settings]="resolvedSettings()"
      (saved)="onSaved($event)"
      (deleted)="onDeleted()"
    />
  }

</div>
