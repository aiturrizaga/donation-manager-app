<form [formGroup]="form" class="flex flex-wrap gap-2 w-full">

  <p-iconfield class="w-full sm:w-64">
    <p-inputicon class="ti ti-search" />
    <input
      pInputText
      type="text"
      placeholder="Buscar por nombre, documento o correo"
      maxlength="100"
      class="w-full"
      [formControl]="form.controls.search"
    />
    @if (form.controls.search.value) {
      <p-inputicon
        class="ti ti-x cursor-pointer"
        (click)="form.controls.search.reset()"
      />
    }
  </p-iconfield>

  <p-select
    formControlName="recordType"
    [options]="recordTypeOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Todos los tipos"
    [showClear]="true"
    class="w-full sm:w-40"
    appendTo="body"
  />

</form>
