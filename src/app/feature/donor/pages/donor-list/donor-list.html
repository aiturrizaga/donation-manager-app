<div class="card">

  <!-- Tabs desktop -->
  <div class="hidden sm:flex items-center border-b border-gray-200 dark:border-zinc-700 status-tabs-bar">
    <p-tabs [value]="activeStatus()" (valueChange)="onStatusChange($event)">
      <p-tablist>
        @for (tab of statusTabs; track $index) {
          <p-tab [value]="tab.value">
            <div class="flex items-center gap-2">
              {{ tab.label }}
              @if (activeStatus() === tab.value) {
                <p-badge [value]="facade.total()" severity="secondary" />
              }
            </div>
          </p-tab>
        }
      </p-tablist>
    </p-tabs>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <app-filters-panel [activeCount]="activeFilterCount()" (clear)="onClearFilters()">
      <app-organization-multi-selector />
      <app-donor-filters
        class="flex-1"
        [search]="search()"
        (filtersChange)="onFiltersChange($event)"
      />
    </app-filters-panel>
    <div class="toolbar__actions">
      <button
        pButton
        type="button"
        severity="secondary"
        [text]="true"
        size="small"
        [loading]="facade.loading()"
        (click)="facade.reload()"
        pTooltip="Recargar"
        tooltipPosition="top"
      >
        <i class="ti ti-refresh" pButtonIcon></i>
      </button>
      <button pButton size="small" (click)="openCreateDialog()">
        <i class="ti ti-plus" pButtonIcon></i>
        <span pButtonLabel class="hidden sm:inline">Nuevo donante</span>
        <span pButtonLabel class="inline sm:hidden">Nuevo</span>
      </button>
    </div>
  </div>

  <!-- Chips mobile -->
  <div class="sm:hidden border-b border-gray-200 dark:border-zinc-700" style="overflow-x: auto; overflow-y: visible;">
    <div class="flex gap-2 px-3 py-2 scrollbar-none" style="width: max-content; min-width: 100%;">
      @for (tab of statusTabs; track $index) {
        <p-chip
          [unstyled]="true"
          class="chip-btn"
          [class.chip-btn--active]="activeStatus() === tab.value"
          (click)="onStatusChange(tab.value)"
        >
          <span class="chip-btn__label">{{ tab.label }}</span>
          @if (activeStatus() === tab.value) {
            <p-badge
              [unstyled]="true"
              [value]="facade.total()"
              class="chip-btn__badge"
            />
          }
        </p-chip>
      }
    </div>
  </div>

  <!-- Data view -->
  @if (facade.error(); as err) {
    <app-inline-error
      message="No se pudo cargar la lista de donantes."
      (retry)="facade.reload()"
    />
  } @else {
    <app-donor-data-view
      [items]="facade.items()"
      [isLoading]="facade.loading()"
      [total]="facade.total()"
      [rows]="50"
      [first]="facade.first()"
      emptyIcon="ti-users"
      [emptyTitle]="emptyText()?.title ?? ''"
      [emptyDescription]="emptyText()?.description ?? ''"
      (toggleActive)="onToggleActive($event)"
      (preview)="onPreview($event)"
      (edit)="openEditDialog($event)"
      (delete)="onDelete($event)"
      (pageChange)="onPageChange($event)"
    />
  }

</div>

<!-- Preview drawer -->
@if (previewDonor()) {
  <app-donor-preview-drawer
    [donor]="previewDonor()!"
    [visible]="previewVisible()"
    (visibleChange)="previewVisible.set($event)"
  />
}
