<div class="flex flex-col gap-4">

  <!-- Header -->
  <div class="card p-4">
    <div class="mb-4">
      <p-button
        icon="ti ti-arrow-left"
        label="Volver a catálogos"
        severity="secondary"
        [text]="true"
        size="small"
        (onClick)="goBack()"
      />
    </div>

    <div class="flex items-start justify-between gap-4">
      <div class="flex flex-col gap-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-lg font-semibold text-gray-900">{{ lookup().name }}</span>
          <p-tag
            [value]="lookup().isActive ? 'Activo' : 'Inactivo'"
            [severity]="lookup().isActive ? 'success' : 'secondary'"
          />
        </div>
        <span class="text-sm text-gray-400 font-mono">{{ lookup().code }}</span>
        @if (lookup().description) {
          <p class="text-sm text-gray-500 mt-1">{{ lookup().description }}</p>
        }
      </div>

      <p-button
        icon="ti ti-pencil"
        label="Editar"
        severity="secondary"
        [outlined]="true"
        size="small"
        styleClass="shrink-0"
        (onClick)="editLookup()"
      />
    </div>
  </div>

  <!-- Items -->
  <div class="card">
    <div class="toolbar">
      <p class="text-sm text-gray-500 flex-1">
        Ítems del catálogo, en el orden en que se muestran al usuario final.
      </p>
      <div class="toolbar__actions">
        <button pButton (click)="openCreateItemDialog()">
          <i class="ti ti-plus" pButtonIcon></i>
          <span pButtonLabel>Nuevo ítem</span>
        </button>
      </div>
    </div>

    <p-table [value]="lookup().items" [tableStyle]="{ 'min-width': '480px' }">
      <ng-template #header>
        <tr>
          <th class="w-20">Orden</th>
          <th>Valor</th>
          <th>Etiqueta</th>
          <th>Estado</th>
          <th class="w-24"></th>
        </tr>
      </ng-template>

      <ng-template #body let-item>
        <tr>
          <td>{{ item.sortOrder }}</td>
          <td class="font-mono text-sm">{{ item.value }}</td>
          <td>{{ item.label }}</td>
          <td>
            <p-tag
              [value]="item.isActive ? 'Activo' : 'Inactivo'"
              [severity]="item.isActive ? 'success' : 'secondary'"
            />
          </td>
          <td>
            <div class="flex items-center gap-1">
              <p-button
                icon="ti ti-pencil"
                pTooltip="Editar"
                tooltipPosition="top"
                severity="secondary"
                [text]="true"
                size="small"
                (onClick)="openEditItemDialog(item)"
              />
              <p-button
                icon="ti ti-trash"
                pTooltip="Eliminar"
                tooltipPosition="top"
                severity="danger"
                [text]="true"
                size="small"
                (onClick)="onDeleteItem(item)"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="text-center py-0">
            <app-empty-state
              icon="ti-list-details"
              iconClass="text-5xl"
              title="Aún no hay ítems"
              description="Agrega el primer ítem de este catálogo."
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
